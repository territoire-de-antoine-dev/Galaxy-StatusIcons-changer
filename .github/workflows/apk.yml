name: Compiler et vérifier l’APK
on: [push, workflow_dispatch]
permissions:
  contents: read
jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/wrapper-validation@v4
      - run: node --check app/src/main/assets/editor.js
      - run: bash gradlew --no-daemon :app:assembleDebug :app:lintDebug
      - name: Contrôler la signature et le point d’entrée LSPosed
        run: |
          apk=app/build/outputs/apk/debug/app-debug.apk
          "$ANDROID_HOME/build-tools/34.0.0/apksigner" verify --verbose "$apk"
          test "$(unzip -p "$apk" assets/xposed_init)" = "studio.galaxy.statusbar.Icons"
          sha256sum "$apk" > app-debug.sha256
      - uses: actions/upload-artifact@v4
        with:
          name: Galaxy-Status-Bar-Studio-debug
          path: |
            app/build/outputs/apk/debug/app-debug.apk
            app-debug.sha256
